name: torino-quest-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torino_quest
      POSTGRES_USER: torino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Esegui npm run local:setup}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torino -d torino_quest"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
